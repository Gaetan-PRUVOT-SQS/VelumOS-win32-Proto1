<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;overflow:hidden;">
  <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;background:radial-gradient(55% 75% at 12% 18%,#8fd6d2 0%,rgba(143,214,210,0) 62%),radial-gradient(50% 70% at 88% 12%,#bcaaf2 0%,rgba(188,170,242,0) 62%),radial-gradient(65% 70% at 72% 95%,#f6c890 0%,rgba(246,200,144,0) 62%),radial-gradient(55% 60% at 18% 100%,#eea3a6 0%,rgba(238,163,166,0) 60%),#e3e6f0;"></div>
    <div style="position:absolute;left:-10%;top:30%;width:80%;height:38%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,0.75),rgba(255,255,255,0));filter:blur(40px);transform:rotate(-12deg);"></div>
    <div style="position:absolute;right:-15%;top:8%;width:70%;height:30%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,0.55));filter:blur(50px);transform:rotate(18deg);"></div>
  </sc-if>
  <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:radial-gradient(55% 75% at 12% 18%,#1f6f72 0%,rgba(31,111,114,0) 62%),radial-gradient(50% 70% at 88% 12%,#4b3c8f 0%,rgba(75,60,143,0) 62%),radial-gradient(65% 70% at 72% 95%,#8a5a2a 0%,rgba(138,90,42,0) 62%),radial-gradient(55% 60% at 18% 100%,#7a3640 0%,rgba(122,54,64,0) 60%),#0d1120;"></div>
    <div style="position:absolute;left:-10%;top:30%;width:80%;height:38%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,0.14),rgba(255,255,255,0));filter:blur(40px);transform:rotate(-12deg);"></div>
    <div style="position:absolute;right:-15%;top:8%;width:70%;height:30%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,0.1));filter:blur(50px);transform:rotate(18deg);"></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() { return { isDark: !!this.props.dark, isLight: !this.props.dark }; }
}
</script>
</body>
</html>
