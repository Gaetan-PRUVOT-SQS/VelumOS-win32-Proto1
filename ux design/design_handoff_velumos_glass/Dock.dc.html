<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;left:12px;right:12px;bottom:12px;height:56px;font-family:'Instrument Sans',sans-serif;">
  <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:22px;background:rgba(255,255,255,0.32);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),inset 0 -1px 0 rgba(255,255,255,0.3),inset 0 0 0 1px rgba(255,255,255,0.4),0 16px 40px rgba(40,40,90,0.22);color:#141824;">
      <div style="position:absolute;inset:0;border-radius:22px;background:linear-gradient(170deg,rgba(255,255,255,0.5) 0%,rgba(255,255,255,0) 45%);pointer-events:none;"></div>
      <div style="position:relative;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.55);box-shadow:inset 0 1px 0 #fff,0 2px 8px rgba(40,40,90,0.15);display:flex;align-items:center;justify-content:center;">
        <sc-if value="{{ launcherOpen }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:-3px;border-radius:50%;box-shadow:0 0 0 2px #0f7d83;"></div></sc-if>
        <img src="icons/logo.svg" alt="" style="width:32px;height:32px;display:block;">
      </div>
      <div style="position:relative;flex:1;display:flex;gap:6px;min-width:0;padding-left:4px;">
        <sc-for list="{{ apps }}" as="app" hint-placeholder-count="1">
          <div style="position:relative;display:flex;align-items:center;gap:9px;height:40px;padding:0 14px 0 9px;border-radius:14px;background:{{ app.bg }};box-shadow:{{ app.shadow }};font-size:13px;font-weight:600;">
            <img src="{{ app.icon }}" alt="" style="width:24px;height:24px;display:block;">{{ app.name }}
            <div style="position:absolute;left:50%;bottom:3px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:{{ app.dot }};"></div>
          </div>
        </sc-for>
      </div>
      <div style="position:relative;display:flex;align-items:center;gap:14px;height:42px;padding:0 6px 0 14px;border-radius:16px;background:rgba(255,255,255,0.35);box-shadow:inset 0 1px 0 rgba(255,255,255,0.8);font-size:12px;">
        <span style="font-weight:600;color:#4a5163;">FR</span>
        <div style="display:flex;gap:5px;align-items:center;"><div style="width:7px;height:7px;border-radius:50%;background:#4a5163;"></div><div style="width:7px;height:7px;border-radius:50%;background:#4a5163;"></div><div style="width:14px;height:8px;border-radius:3px;border:1.5px solid #4a5163;box-sizing:border-box;"></div></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;"><span style="font-weight:700;font-size:13px;">15:48</span><span style="color:#4a5163;font-size:11px;">06/10/2026</span></div>
        <div style="width:30px;height:30px;border-radius:11px;background:rgba(255,255,255,0.7);box-shadow:inset 0 1px 0 #fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;">3</div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:22px;background:rgba(20,24,36,0.42);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,0.2),inset 0 0 0 1px rgba(255,255,255,0.08),0 16px 40px rgba(0,0,0,0.45);color:#f1f3f8;">
      <div style="position:absolute;inset:0;border-radius:22px;background:linear-gradient(170deg,rgba(255,255,255,0.12) 0%,rgba(255,255,255,0) 45%);pointer-events:none;"></div>
      <div style="position:relative;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.1);box-shadow:inset 0 1px 0 rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;">
        <sc-if value="{{ launcherOpen }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:-3px;border-radius:50%;box-shadow:0 0 0 2px #4fd1cc;"></div></sc-if>
        <img src="icons/logo.svg" alt="" style="width:32px;height:32px;display:block;">
      </div>
      <div style="position:relative;flex:1;display:flex;gap:6px;min-width:0;padding-left:4px;">
        <sc-for list="{{ apps }}" as="app" hint-placeholder-count="1">
          <div style="position:relative;display:flex;align-items:center;gap:9px;height:40px;padding:0 14px 0 9px;border-radius:14px;background:{{ app.bgDark }};box-shadow:{{ app.shadowDark }};font-size:13px;font-weight:600;">
            <img src="{{ app.icon }}" alt="" style="width:24px;height:24px;display:block;">{{ app.name }}
            <div style="position:absolute;left:50%;bottom:3px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:{{ app.dotDark }};"></div>
          </div>
        </sc-for>
      </div>
      <div style="position:relative;display:flex;align-items:center;gap:14px;height:42px;padding:0 6px 0 14px;border-radius:16px;background:rgba(255,255,255,0.07);box-shadow:inset 0 1px 0 rgba(255,255,255,0.12);font-size:12px;">
        <span style="font-weight:600;color:#aab2c3;">FR</span>
        <div style="display:flex;gap:5px;align-items:center;"><div style="width:7px;height:7px;border-radius:50%;background:#aab2c3;"></div><div style="width:7px;height:7px;border-radius:50%;background:#aab2c3;"></div><div style="width:14px;height:8px;border-radius:3px;border:1.5px solid #aab2c3;box-sizing:border-box;"></div></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;"><span style="font-weight:700;font-size:13px;">15:48</span><span style="color:#aab2c3;font-size:11px;">06/10/2026</span></div>
        <div style="width:30px;height:30px;border-radius:11px;background:rgba(255,255,255,0.12);box-shadow:inset 0 1px 0 rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;">3</div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:80},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;launcherOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;apps&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[&quot;Bonjour&quot;],&quot;tsType&quot;:&quot;string[]&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bonjour&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const icons = { 'Fichiers': 'icons/folder.svg', 'Console': 'icons/run.svg', 'Réglages': 'icons/settings.svg', 'Bonjour': 'icons/program.svg' };
    const apps = (p.apps || []).map(n => {
      const a = n === p.active;
      return {
        name: n, icon: icons[n] || 'icons/program.svg',
        bg: a ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.22)',
        shadow: a ? 'inset 0 1px 0 #fff, 0 2px 8px rgba(40,40,90,0.12)' : 'none',
        dot: a ? '#0f7d83' : 'transparent',
        bgDark: a ? 'rgba(255,255,255,0.16)' : 'rgba(255,255,255,0.05)',
        shadowDark: a ? 'inset 0 1px 0 rgba(255,255,255,0.22)' : 'none',
        dotDark: a ? '#4fd1cc' : 'transparent',
      };
    });
    return { apps, isDark: !!p.dark, isLight: !p.dark, launcherOpen: !!p.launcherOpen };
  }
}
</script>
</body>
</html>
