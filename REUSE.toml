version = 1
SPDX-PackageName = "VelumOS"

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 VelumOS contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = ["third_party/fonts/OpenSans-*.ttf", "third_party/fonts/OpenSans-LICENSE.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2010-2011 Google Corporation"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["third_party/fonts/NotoSansMono-Variable.ttf", "third_party/fonts/Noto-LICENSE.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["third_party/fonts/InstrumentSans-Variable.ttf", "third_party/fonts/InstrumentSans-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Instrument Sans Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["third_party/fonts/JetBrainsMono-Variable.ttf", "third_party/fonts/JetBrainsMono-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["lib/font/gen/font_ui.c", "lib/font/gen/font_ui_bold.c", "lib/font/gen/font_title.c"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 VelumOS contributors", "2010-2011 Google Corporation"]
SPDX-License-Identifier = "GPL-2.0-or-later AND Apache-2.0"

[[annotations]]
path = "lib/font/gen/font_mono.c"
precedence = "override"
SPDX-FileCopyrightText = ["2026 VelumOS contributors", "2022 The Noto Project Authors"]
SPDX-License-Identifier = "GPL-2.0-or-later AND OFL-1.1"

[[annotations]]
path = "lib/font/gen/font_ins_*.c"
precedence = "override"
SPDX-FileCopyrightText = ["2026 VelumOS contributors", "2022 The Instrument Sans Project Authors"]
SPDX-License-Identifier = "GPL-2.0-or-later AND OFL-1.1"

[[annotations]]
path = "lib/font/gen/font_jbm_14.c"
precedence = "override"
SPDX-FileCopyrightText = ["2026 VelumOS contributors", "2020 The JetBrains Mono Project Authors"]
SPDX-License-Identifier = "GPL-2.0-or-later AND OFL-1.1"

[[annotations]]
path = "assets/*.png"
precedence = "override"
SPDX-FileCopyrightText = "2026 VelumOS contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"
