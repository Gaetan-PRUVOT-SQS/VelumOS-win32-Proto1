[[manuel]]
id = "MT-01"
titre = "Écran de démarrage"
objectif = "Vérifier l'aspect de l'écran de démarrage et la progression de la barre."
prerequis = "make all, image construite."
etapes = ["Lancer make run.", "Observer l'écran dès l'ouverture de la fenêtre QEMU.", "Noter l'emblème, le nom, la barre à trois blocs et le texte."]
attendu = "Fond noir, emblème centré, nom VelumOS, barre de progression qui avance, aucun artefact."
statut = "Réussi"
date = "2026-10-05"
moyen = "QEMU sans KVM (émulation pure), 70 captures successives pendant le démarrage"
constat = "Fond noir, emblème centré, nom VelumOS, barre à trois blocs et texte « Démarrage en cours ». Les blocs avancent d'une capture à l'autre (positions relevées : 382, 408 puis 547 px) et le filet sous la barre se remplit. Sous KVM l'écran ne reste affiché qu'environ 0,2 s, la progression n'est visible qu'en émulation lente."
observations = ["Avant l'écran de démarrage, la console texte du BIOS reste visible environ une seconde."]
incidents = []
duree = 5

[[manuel]]
id = "MT-02"
titre = "Démarrage en UEFI"
objectif = "Vérifier que le système démarre avec OVMF et affiche la même session qu'en BIOS."
prerequis = "OVMF installé, image construite."
etapes = ["Lancer make run-uefi.", "Ouvrir la session.", "Comparer avec le démarrage BIOS."]
attendu = "Même écran de démarrage, même bureau, mêmes entrées clavier et souris."
statut = "Réussi"
date = "2026-10-05"
moyen = "QEMU/KVM avec OVMF, clavier et souris injectés par le moniteur, captures comparées au BIOS"
constat = "L'écran de connexion est identique pixel pour pixel à celui du BIOS (0 pixel différent). Le bureau et le menu ne diffèrent que par l'heure (28 pixels). Clavier (Entrée, touche Windows, Échap) et souris (clic sur Démarrer) fonctionnent. Le journal série indique « boot: UEFI »."
observations = []
incidents = []
duree = 10

[[manuel]]
id = "MT-04"
titre = "Fidélité visuelle au style Luna"
objectif = "Comparer les dimensions et les couleurs avec des captures de référence documentées."
prerequis = "Captures de référence de l'interface d'époque (documentation publique)."
etapes = ["Capturer le bureau, une fenêtre et le menu Démarrer à 1024x768.", "Mesurer barre des tâches, barre de titre, boutons de légende, bouton Démarrer.", "Noter les écarts en pixels."]
attendu = "Écarts de un pixel au plus sur les dimensions, couleurs proches de la palette Luna."
note = "Joué le 5 octobre sur l'ancien thème Luna. Ne vaut plus pour le thème verre : voir MT-25."
statut = "Partiel"
date = "2026-10-05"
moyen = "QEMU/KVM, mesures en pixels sur captures 1024x768"
constat = "Barre des tâches 30 px, barre de titre 30 px, cadre 4 px, boutons de légende 21x21, bouton Démarrer 100 px et zone de notification 80 px : conformes aux valeurs documentées dans la justification a17. L'entrée du menu Démarrer mesure 30 px alors que 22 est documenté. Aucune capture de référence d'époque n'est disponible hors ligne, la comparaison à de vraies captures reste à faire."
observations = ["Entrée de menu à 30 px contre 22 px documentés (valeur marquée incertaine dans la justification)."]
incidents = []
duree = 45

[[manuel]]
id = "MT-05"
titre = "Lisibilité des polices"
objectif = "Vérifier la netteté des textes et le rendu des accents français."
