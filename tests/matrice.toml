[[manuel]]
id = "MT-06"
titre = "Manipulation des fenêtres à la souris"
objectif = "Déplacer, redimensionner, réduire, agrandir, restaurer et fermer une fenêtre."
prerequis = "Session ouverte, fenêtre Bonjour ouverte."
etapes = ["Glisser la barre de titre.", "Redimensionner par les bords et les coins.", "Utiliser les trois boutons de légende.", "Cliquer une autre fenêtre et vérifier l'ordre."]
attendu = "Mouvements fluides, tailles minimales respectées, ordre et focus cohérents."
statut = "Réussi"
date = "2026-10-05"
moyen = "QEMU/KVM, souris injectée par le moniteur (déplacements relatifs), captures relues"
constat = "Glisser de la barre de titre (déplacement exact de 400 x 200 px), redimensionnement par le coin inférieur droit (agrandi de 62 x 82 px, puis réduit jusqu'à une taille minimale d'environ 110 x 130 px), réduire, agrandir (la zone de travail est remplie, le bouton devient « restaurer »), restaurer (ancienne taille et position), fermer par la croix. Quand on réduit ou ferme la fenêtre active, le focus passe à la fenêtre suivante."
observations = ["Les nouvelles fenêtres s'ouvrent toutes au même endroit, sans décalage en cascade.", "À la taille minimale, le titre est tronqué sous les boutons de légende et le bouton Fermer est coupé.", "Le contenu ne se remet pas en page quand la fenêtre est agrandie : le bouton Fermer reste à sa place."]
incidents = []
duree = 15

[[manuel]]
id = "MT-07"
titre = "Menu Démarrer au clavier"
objectif = "Parcourir le menu avec les flèches, Entrée, Échap et la touche Windows."
prerequis = "Session ouverte."
etapes = ["Appuyer sur la touche Windows.", "Naviguer avec les flèches, ouvrir Tous les programmes.", "Fermer avec Échap."]
attendu = "Sélection visible, sous-menu ouvert et fermé correctement, focus rendu à la fenêtre précédente."
statut = "Réussi"
date = "2026-10-05"
moyen = "QEMU/KVM, clavier injecté par le moniteur, captures relues"
constat = "La touche Windows ouvre le menu, les flèches haut et bas déplacent la sélection (visible en bleu), la flèche droite ou Entrée sur « Tous les programmes » ouvre la liste (Bonjour, Retour), la flèche gauche ou Échap revient au menu principal, un second Échap ferme le menu et le bureau redevient identique. Avec une fenêtre ouverte, son titre reste actif pendant et après l'ouverture du menu (0 pixel différent)."
observations = ["La flèche droite sur « Fermer la session » ne passe pas à « Éteindre » : il faut la flèche bas."]
incidents = []
duree = 10

