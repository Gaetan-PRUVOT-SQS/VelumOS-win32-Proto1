# Matrice de couverture fonctionnelle de VelumOS (tranche 1).
#
# mode = "A"   vérifiée par des tests automatisés, oracle automatique
# mode = "AM"  vérifiée par des tests automatisés pour la logique, avec un complément manuel
#              (aspect visuel, ergonomie, vrai périphérique)
# mode = "M"   vérifiée seulement à la main (aucun test automatisé dans le dépôt)
#
# `tools/matrice_couverture.py` vérifie que chaque test cité existe, calcule les taux et
# régénère tests/MATRICE.md et tests/MANUEL.md.

